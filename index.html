<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lash Shop Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app on the left (full screen on a phone), touchpoint guide on the right */
:root{
  --bg:#efedf2; --fg:#1b1820; --muted:#6c6675; --line:#dedae4; --panel:#fff;
  --red:#ee2f53; --red-d:#c81e40; --red-soft:#ffe9ee; --new:#7b3fe4; --new-soft:#f1eaff; --imp:#0b8a7a; --imp-soft:#e3f6f3;
  --a-bg:#fff; --a-fg:#161318; --a-mut:#86808e; --a-line:#efecf2; --a-soft:#f6f5f8; --gold:#f5b301; --ok:#18a058; --diff:#fff4cc;
  --f:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141218;--fg:#eeeaf3;--muted:#a49cb0;--line:#2c2833;--panel:#1d1a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141218;--fg:#eeeaf3;--muted:#a49cb0;--line:#2c2833;--panel:#1d1a22;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.phone{width:390px;height:820px;border-radius:46px;background:#0c0b0e;padding:11px;box-shadow:0 24px 60px -24px rgba(20,10,30,.5);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--a-bg);color:var(--a-fg);display:flex;flex-direction:column;color-scheme:light}
.wrap{padding-block:24px}.phone{width:417px;height:876px;flex:none;top:0;box-sizing:border-box;background:linear-gradient(145deg,#f4f4f6 0%,#b9bbc2 18%,#e9eaee 45%,#8e9099 75%,#d9dadf 100%);padding:12px;border-radius:60px;position:relative}
.phone::before{content:"";position:absolute;inset:3px;border-radius:57px;background:#0c0b0e}
.phone .scr{box-shadow:0 0 0 1px #0c0b0e;border-radius:50px}
.isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:999;pointer-events:none}
.isl::after{content:"";position:absolute;right:13px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#34405e,#05070c 70%)}
.pbtn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#9a9ca4,#d8d9de)}
.pbtn.b1{left:-3px;top:140px;height:32px}.pbtn.b2{left:-3px;top:200px;height:62px}.pbtn.b3{left:-3px;top:275px;height:62px}.pbtn.b4{right:-3px;top:220px;height:96px}
@media (max-width:500px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .phone{width:100%;height:100dvh;aspect-ratio:auto;border-radius:0;padding:0;position:relative;top:0;box-shadow:none;background:none}.wrap{padding:0}.phone::before,.pbtn{display:none}.phone .scr{border-radius:0}
  .scr{border-radius:0}
  .guide{padding:20px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px))}
}
/* guide */
.guide h1{font-size:1.45rem;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.guide p{margin:0 0 8px;color:var(--muted);max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.tp{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tp li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tp li.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.tp .h{display:flex;gap:10px;align-items:baseline}
.tp .n{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;min-width:34px}
.tp b{font-weight:600}
.tp .ty{margin-left:auto;font-size:.72rem;color:var(--muted)}
.tp .jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tp .jumps button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:.78rem;cursor:pointer}
.tp .jumps button:hover{border-color:var(--red);color:var(--red)}
.tp .fx{font-size:.78rem;color:var(--muted);margin-top:4px}
.sol{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sol h3{margin:0 0 6px;font-size:.95rem}
.sol ol{margin:0;padding-left:20px;font-size:.85rem}
.small{font-size:.78rem;color:var(--muted);margin-top:12px}
/* badges */
.bN,.bI{display:inline-flex;align-items:center;gap:3px;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap;vertical-align:middle;line-height:1.5}
.bN{background:var(--new-soft);color:var(--new)}
.bI{background:var(--imp-soft);color:var(--imp)}
/* app chrome */
.sb{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:.8rem;font-weight:600;position:relative;z-index:5}
.sbt{font-size:15px;font-weight:600;letter-spacing:-.2px;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;width:72px;text-align:center}.sbi{display:flex;align-items:center;gap:6px;width:84px;justify-content:center}.sb{height:52px;padding:0 22px 0 26px}
.sb.dark{color:#fff;position:absolute;top:0;left:0;right:0}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.view::-webkit-scrollbar{width:0}
.top{display:flex;align-items:center;gap:6px;padding:4px 10px 8px;background:var(--a-bg);border-bottom:1px solid var(--a-line);flex:none}
.top h2{margin:0;font-size:1rem;font-weight:600;flex:1;text-align:center}
.top .sp{width:36px}
.ib{border:0;background:transparent;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;cursor:pointer;flex:none;position:relative}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:.6rem;font-weight:700;border-radius:99px;padding:0 5px;line-height:1.5}
.bar{flex:none;border-top:1px solid var(--a-line);padding:8px 12px 22px;display:flex;gap:8px;align-items:center;background:var(--a-bg)}
.btn{border:0;cursor:pointer;border-radius:10px;padding:11px 12px;font-weight:600;font-size:.9rem;flex:1;text-align:center;line-height:1.25}
.btn.p{background:var(--red);color:#fff}
.btn.s{background:var(--a-soft);color:var(--a-fg)}
.btn.o{background:#fff;border:1px solid var(--red);color:var(--red)}
.ycart{border:0;cursor:pointer;flex:none;width:68px;height:46px;border-radius:999px;background:#fdecef;color:#e2445c;display:grid;place-items:center}
.bar .btn.p{border-radius:999px;background:#e8445a;min-height:46px}
.bar .btn.p .sub{opacity:.75}
.ycart svg{width:26px;height:26px}
.mini.cmpb{color:var(--a-fg)}
.btn.sm{padding:7px 10px;font-size:.8rem;flex:none}
.btn .sub{display:block;font-size:.66rem;font-weight:400;opacity:.9}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.mini{border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:1px;font-size:.66rem;color:var(--a-fg);padding:0 4px;flex:none}
.mini svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.pad{padding:12px 14px}
.card{background:#fff;border-radius:12px}
.sec{background:#fff;padding:12px 14px;border-bottom:8px solid var(--a-soft)}
.mut{color:var(--a-mut);font-size:.78rem}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{height:0}
.chip{border:1px solid var(--a-line);background:#fff;border-radius:99px;padding:5px 11px;font-size:.78rem;white-space:nowrap;cursor:pointer}
.chip.on{border-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:600}
.price{color:var(--red);font-weight:700}
.strike{text-decoration:line-through;color:var(--a-mut);font-size:.75rem}
.vtag{display:inline-block;background:var(--a-soft);border-radius:6px;padding:2px 8px;font-size:.74rem;margin-top:3px}
.vtag.hl{background:var(--red-soft);color:var(--red-d);font-weight:600}
.thumb{border-radius:8px;object-fit:cover;background:#f3eef1;flex:none;display:block}
.stars{color:var(--gold);letter-spacing:1px}
.snack{position:absolute;left:12px;right:12px;bottom:84px;background:#1b1820;color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:.82rem;z-index:30;animation:up .2s ease-out}
.snack span{flex:1}
.snack button{border:0;background:var(--red);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,18,24,.9);color:#fff;font-size:.85rem;padding:10px 16px;border-radius:12px;max-width:80%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
/* sheet */
.shade{position:absolute;inset:0;background:rgba(10,8,14,.45);z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:16px 16px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .sv{overflow-y:auto;padding:12px 14px;min-height:0}
.sheet .sh{display:flex;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--a-line);align-items:flex-start}
/* feed */
.feed{position:absolute;inset:0;background:#000}
.feed img.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftabs{position:absolute;top:46px;left:0;right:0;display:flex;justify-content:center;gap:18px;color:rgba(255,255,255,.75);font-weight:600;z-index:3}
.ftabs button{background:none;border:0;color:inherit;cursor:pointer;padding:4px 0}
.ftabs .on{color:#fff;border-bottom:2px solid #fff}
.fside{position:absolute;right:8px;bottom:190px;display:grid;gap:16px;justify-items:center;color:#fff;z-index:3}
.fside button{background:none;border:0;color:#fff;display:grid;justify-items:center;font-size:.7rem;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.fside svg{width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.fside .av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#f7a1bb,#c64f7f);display:grid;place-items:center;font-weight:700}
.fcap{position:absolute;left:12px;right:70px;bottom:94px;color:#fff;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fcap b{font-size:.95rem}
.fcap p{margin:2px 0 0;font-size:.82rem}
.anchor{display:flex;gap:10px;align-items:center;background:rgba(40,40,46,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:8px 12px 8px 8px;margin-bottom:10px;cursor:pointer;border:0;max-width:100%;text-align:left;text-shadow:none}
.anchor b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anchor span:not(.bagbig){display:block;font-size:.74rem;color:rgba(255,255,255,.7)}
.bagbig{width:34px;height:34px;border-radius:8px;background:#f8c51c;display:grid;place-items:center;flex:none}
.bag{background:#f6c700;border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.vidtxt{position:absolute;left:0;right:0;top:44%;text-align:center;color:#fff;z-index:2;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6),0 0 2px #000}
.vidtxt .big{font-size:2.2rem;letter-spacing:1px;display:block}
.prog{position:absolute;left:0;right:0;bottom:62px;height:2px;background:rgba(255,255,255,.25);z-index:3}
.prog i{display:block;height:100%;background:#fff;width:0;animation:pg 12s linear infinite}
@keyframes pg{to{width:100%}}
.nav{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:6px;background:#000;color:#fff;z-index:4}
.nav.light{background:#fff;color:#111;border-top:1px solid var(--a-line);position:static;flex:none}
.nav button{background:none;border:0;color:inherit;display:grid;justify-items:center;font-size:.66rem;cursor:pointer;position:relative}
.nav svg{width:24px;height:24px}
.plus{width:44px;height:28px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;box-shadow:-3px 0 0 #25f4ee,3px 0 0 #fe2c55}
/* product */
.gal{position:relative;background:#f5eef1}
.gal img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover}
.gal .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;border-radius:99px;padding:1px 9px}
.gal .fromv{position:absolute;left:10px;top:10px}
.pbanner{background:linear-gradient(90deg,var(--red),#ff6a3d);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px}
.pbanner .pp{font-size:1.35rem;font-weight:700}
.ptabs{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--a-line);background:#fff;position:sticky;top:0;z-index:3}
.ptabs button{border:0;background:none;padding:10px 0;cursor:pointer;color:var(--a-mut);font-weight:500}
.ptabs .on{color:var(--a-fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--a-fg)}
.vstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.vstrip::-webkit-scrollbar{height:0}
.vstrip button{border:1px solid var(--a-line);background:#fff;border-radius:8px;padding:3px;cursor:pointer;flex:none;width:62px;font-size:.62rem;text-align:center}
.vstrip img{width:100%;aspect-ratio:1;border-radius:6px;display:block;object-fit:cover}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tools button{border:1px solid #e2d6fb;background:var(--new-soft);color:#4b1fa6;border-radius:10px;padding:8px 4px;font-size:.74rem;font-weight:600;cursor:pointer;display:grid;justify-items:center;gap:2px}
.tools svg{width:20px;height:20px}
.spec{width:100%;border-collapse:collapse;font-size:.8rem}
.spec td{padding:6px 4px;border-bottom:1px solid var(--a-line);vertical-align:top}
.spec td:first-child{color:var(--a-mut);width:38%}
.rev{padding:10px 0;border-bottom:1px solid var(--a-line)}
.rev .who{display:flex;gap:8px;align-items:center;font-size:.8rem}
.rev .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.7rem;font-weight:700}
.rev p{margin:4px 0;font-size:.82rem}
.rev .ph{display:flex;gap:6px}
.rev .ph img{width:84px;height:84px}
.rbar{display:grid;grid-template-columns:60px 1fr 46px;gap:6px;align-items:center;font-size:.74rem}
.rbar .tr{height:6px;background:var(--a-line);border-radius:3px;overflow:hidden}
.rbar .tr i{display:block;height:100%;background:var(--gold)}
.ai{background:var(--a-soft);border-radius:10px;padding:8px 10px;font-size:.8rem;margin-top:8px}
/* variant sheet */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vc{border:1px solid var(--a-line);border-radius:10px;padding:4px 4px 6px;background:#fff;cursor:pointer;text-align:center;position:relative}
.vc img{width:100%;aspect-ratio:1;border-radius:7px;display:block;object-fit:cover}
.vc b{display:block;font-size:.78rem;margin-top:3px}
.vc span{display:block;font-size:.66rem;color:var(--a-mut);line-height:1.3}
.vc.on{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.vc .ck{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:.7rem;display:grid;place-items:center}
.vc .zoom{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:6px;width:22px;height:22px;display:grid;place-items:center;cursor:pointer}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{border:1px solid var(--a-line);background:var(--a-soft);border-radius:8px;padding:7px 12px;font-size:.8rem;cursor:pointer}
.opt button.on{border-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:600}
.opt button:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.lbl{font-weight:600;font-size:.85rem;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.alert{background:#fff4f0;border:1px solid #ffc8b8;color:#b3261e;border-radius:8px;padding:7px 10px;font-size:.78rem;margin-top:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--a-line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--a-soft);width:30px;height:28px;cursor:pointer;font-weight:700}
.qty span{min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
/* compare */
.sw{border:0;width:40px;height:23px;border-radius:99px;background:#cfc9d6;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]::after{left:20px}
.cg{display:grid;gap:6px}
.ch{border:1px solid var(--a-line);border-radius:10px;padding:5px;text-align:center;cursor:pointer;background:#fff;position:relative}
.ch.on{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.ch img{width:100%;aspect-ratio:1;border-radius:7px;display:block;object-fit:cover}
.ch img.eye{aspect-ratio:3/2;margin-top:4px}
.ch b{font-size:.8rem;display:block;margin-top:3px}
.crow{margin-top:8px}
.crow .k{font-size:.7rem;color:var(--a-mut);margin:0 2px 3px;display:flex;gap:6px;align-items:center}
.crow .k em{font-style:normal;font-size:.6rem;background:var(--gold);color:#3b2a00;padding:0 6px;border-radius:99px;font-weight:700}
.crow .vv{display:grid;gap:6px}
.crow .vv div{font-size:.76rem;padding:6px 4px;border-radius:8px;background:var(--a-soft);text-align:center;line-height:1.35}
.crow.d .vv div{background:var(--diff)}
.crow .vv div.sel{box-shadow:inset 0 0 0 2px var(--red)}
.lic{width:26px;height:26px;border-radius:8px;background:#fdecef;color:#e8445a;display:inline-grid;place-items:center;flex:none}.lic svg{width:15px;height:15px}
.okhero{background:linear-gradient(160deg,#ff5d73,#e8445a 55%,#c9304a);color:#fff;text-align:center;padding:22px 16px 26px;border-radius:0 0 26px 26px}
.okhero b{display:block;font-size:1.25rem;margin-top:6px}.okhero p{margin:2px 0 0;font-size:.78rem;opacity:.9}
.okring{width:92px;height:92px;margin:0 auto;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:okpop .5s ease-out}
.okhero .big-ok{margin:0;background:#fff;color:#e8445a;width:66px;height:66px}.okhero .big-ok svg{width:34px;height:34px}
@keyframes okpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.okamt{font-size:1.7rem;font-weight:800;margin-top:10px}.okpay{display:inline-block;margin-top:4px;font-size:.7rem;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.okcard{background:#fff;margin:12px 12px 0;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(40,20,60,.06)}
.okhero+.okcard{margin-top:-14px;position:relative}
.oksteps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;position:relative}
.oksteps::before{content:"";position:absolute;top:12px;left:12%;right:12%;height:2px;background:#eee8ef}
.oksteps div{text-align:center;position:relative}.oksteps i{display:grid;place-items:center;width:26px;height:26px;margin:0 auto;border-radius:50%;background:#f1edf3;color:#8a8292;font-style:normal;font-size:.72rem;font-weight:700;border:2px solid #fff}

function jump(k){S.sheet=null;S.stack=["feed"];
 const need=()=>{if(!S.sel)S.sel="NEL003";if(!S.opt)S.opt="tw"};
 switch(k){case"reviews":S.ptab="rv";S.rf="NEL003";S.scr="product";S.sel=S.sel||"NEL003";break;case"desc":S.ptab="ds";S.scr="product";S.sel=S.sel||"NEL003";break;case"product":S.ptab="ov";S.scr="product";break;
  case"sheetv":S.ptab="ov";S.scr="product";S.mode="cart";S.need=false;S.sheet="v";break;case"confirm":need();S.scr="product";S.ptab="ov";S.mode="cart";S.sheet="confirm";break;
  case"compare":S.scr="compare";break;case"finder":S.fd={i:0,a:[]};S.scr="finder";break;case"tryon":S.scr="tryon";break;
  case"cart":if(!S.cart.some(i=>i.v)){need();S.qty=1;addLashToCart()}S.scr="cart";break;
  case"checkout":case"coupon":if(!S.cart.some(i=>i.on&&!i.oos)){need();S.qty=1;addLashToCart()}S.scr="checkout";if(k==="coupon")S.sheet="coupon";break;
  case"orders":ensureOrder();S.otab=S.recv?"rev":"recv";S.scr="orders";break;case"track":ensureOrder();S.recv=false;S.scr="track";break;
  case"delivered":ensureOrder();S.scr="delivered";break;case"inspect":ensureOrder();S.recv=true;S.scr="inspect";break;case"review":ensureOrder();S.recv=true;S.scr="review";break;case"return":ensureOrder();S.recv=true;S.scr="return";break;
  default:S.scr=k}
 render(true)}
